  <!-- Apply saved/system theme and language before the app renders (prevents flash) -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("portfolio-theme"); } catch (e) {}
      if (theme !== "dark" && theme !== "light") {
        theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "light" ? "#f8fafc" : "#030014");

      var lang = null;
      try { lang = localStorage.getItem("portfolio-language"); } catch (e) {}
      if (lang !== "ar" && lang !== "en") {
        lang = (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en";
      }
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    })();
  </script>
