<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    @media (prefers-color-scheme: light) {
      .v { display: none; }
      .l { display: block; }
    }
    @media (prefers-color-scheme: dark), (prefers-color-scheme: no-preference) {
      .l { display: none; }
      .v { display: block; }
    }
  </style>
  <image class="v" href="data:image/png;base64," width="64" height="64"/>
  <image class="l" href="data:image/png;base64," width="64" height="64"/>
</svg>
